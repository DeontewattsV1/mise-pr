name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for CI checks to pass
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request?.number ||
                               (context.payload.workflow_run?.pull_requests &&
                                context.payload.workflow_run.pull_requests[0]?.number);

            if (!pull_number) {
              console.log('No PR number found');
              return;
            }

            // Get the commit SHA
            const prSha = context.payload.pull_request?.head?.sha ||
                         context.payload.workflow_run?.head_sha;

            // Get combined status for the commit
            const { data: status } = await github.rest.repos.getCombinedStatusForRef(
              context.repo.owner,
              context.repo.repo,
              prSha
            );

            console.log('Status state:', status.state);

            // Check if we're waiting on required checks
            if (status.state === 'pending') {
              // Wait for checks to complete
              const pendingChecks = status.statuses.filter(s => s.state === 'pending');
              console.log('Pending checks:', pendingChecks.map(c => c.context).join(', '));
              process.exit(1);
            }

            // Only proceed if all checks passed
            if (status.state !== 'success') {
              console.log('Checks not passed, state:', status.state);
              process.exit(1);
            }

            console.log('All checks passed');

      - name: Enable auto-merge
        run: |
          gh pr merge --admin --auto --merge "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}