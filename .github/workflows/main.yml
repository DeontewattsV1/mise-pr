            - name: Update Node Dependencies
  # You may pin to the exact commit or the version.
  # uses: neverendingqs/gh-action-node-update-deps@b667408f659fda465c63bcdcfdb6c2d0201fad6d
  uses: neverendingqs/gh-action-node-update-deps@v1.7.0
  with:
    # If set, bumps the package version based on value (e.g. patch).
    bump-version: # optional, default is 
    # Git user.email to use for the commit.
    git-user-email: # optional, default is 41898282+github-actions[bot]@users.noreply.github.com
    # Git user.name to use for the commit.
    git-user-name: # optional, default is github-actions[bot]
    # Set to 'yarn' to use yarn. Defaults to npm.
    package-manager: # optional, default is npm
    # A command to run before committing the dependency changes (e.g. npm run build).
    pre-commit-script: # optional
    # Comma-delimited labels to apply to the pull request.
    pull-request-labels: # optional, default is dependencies
          
