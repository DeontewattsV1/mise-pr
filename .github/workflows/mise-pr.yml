name: Mise PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  review-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate review packet
        uses: DeontewattsV1/mise-pr@v0.1.0
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          fail-on: red
          comment: true
            - name: Config for Actions
  # You may pin to the exact commit or the version.
  # uses: Monorepo-Actions/config-for-actions@47b0824054f9eef4a5d1b2df11f4c76b9b0d9117
  uses: Monorepo-Actions/config-for-actions@v1.0.0
  with:
    # The configuration files.
    config_files: # default is .github/config-for-actions.yml
          
