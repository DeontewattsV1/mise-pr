name: "Mise PR Review Packets"
description: "Turn chaotic pull requests into review-ready packets before humans or AI agents review them."
author: "GoodShyt Group"
branding:
  icon: "check-square"
  color: "blue"
inputs:
  base-ref:
    description: "Base git ref used for comparison. Example: origin/main or origin/${{ github.base_ref }}."
    required: false
    default: "origin/main"
  head-ref:
    description: "Head git ref used for comparison. Usually HEAD."
    required: false
    default: "HEAD"
  fail-on:
    description: "Fail the workflow at this risk level or higher: green, yellow, amber, red, never."
    required: false
    default: "red"
  comment:
    description: "Post the generated review packet as a pull request comment. Requires issues: write permission."
    required: false
    default: "false"
  output:
    description: "Markdown report output path."
    required: false
    default: "mise-pr-report.md"
  json-output:
    description: "JSON report output path for agents and automations."
    required: false
    default: "mise-pr-report.json"
outputs:
  report-path:
    description: "Path to the generated Markdown review packet."
    value: ${{ inputs.output }}
  json-report-path:
    description: "Path to the generated JSON review packet."
    value: ${{ inputs.json-output }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Mise PR from action package
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Extract pull request body
      shell: bash
      run: python -m mise_pr.pr_body
    - name: Generate review packet
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
      run: |
        mise-pr analyze \
          --base "${{ inputs.base-ref }}" \
          --head "${{ inputs.head-ref }}" \
          --title "$PR_TITLE" \
          --body-file ".mise-pr-body.md" \
          --repository "${{ github.repository }}" \
          --author "${{ github.actor }}" \
          --output "${{ inputs.output }}" \
          --json-output "${{ inputs.json-output }}" \
          --fail-on "${{ inputs.fail-on }}"
    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs')
          const marker = '<!-- mise-pr-review-packet -->'
          const packet = fs.readFileSync('${{ inputs.output }}', 'utf8')
          const body = `${marker}\n${packet}`
          const { owner, repo } = context.repo
          const issue_number = context.payload.pull_request.number
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
          const existing = comments.find(comment => comment.body && comment.body.includes(marker))
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body })
          }
