<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mise PR — CodeArt trace demo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050914;color:#fff;font-family:Inter,system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}main{position:relative;z-index:1;min-height:100vh;padding:8vw;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 75% 40%,rgba(57,243,255,.16),transparent 30%)}.e{font:700 14px monospace;letter-spacing:.25em;color:#39F3FF}h1{font:800 clamp(56px,9vw,150px) system-ui;margin:.15em 0;text-shadow:0 0 35px rgba(57,243,255,.5)}p{font-size:clamp(20px,2vw,34px);color:#d8e9ff}.trace{height:2px;background:linear-gradient(90deg,#39F3FF,#6D5DFF,transparent);margin:40px 0;position:relative}.node{width:10px;height:10px;border-radius:50%;position:absolute;top:-4px;background:#fff;box-shadow:0 0 20px #39F3FF}.m{display:grid;grid-template-columns:repeat(12,18px);gap:8px}.t{width:18px;height:18px;border-radius:4px;background:#39F3FF;box-shadow:0 0 12px #39F3FF;animation:p 2.2s infinite alternate}@keyframes p{to{transform:translateY(-12px) rotate(8deg);opacity:.25}}footer{margin-top:50px;font:13px monospace;color:#8fa7c8}</style></head><body><canvas id="fx"></canvas><main><div class="e">REVIEW READINESS BEFORE CODE REVIEW</div><h1>Mise PR</h1><p>Turn messy pull requests into review-ready packets.</p><div id="trace" class="trace"></div><section id="m" class="m"></section><footer>TRACE → EVIDENCE → REVIEW PACKET · GitHub Marketplace · Product Hunt · PyPI</footer></main><script>const c=document.querySelector('#fx'),x=c.getContext('2d');let W,H,q=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;q=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.2,v:(Math.random()-.5)*.35}))}rs();addEventListener('resize',rs);(function f(){x.clearRect(0,0,W,H);for(const p of q){p.y+=p.v;if(p.y<0)p.y=H;if(p.y>H)p.y=0;x.fillStyle=`rgba(100,200,255,${.08*p.z})`;x.fillRect(p.x,p.y,1.2*p.z,1.2*p.z)}requestAnimationFrame(f)})();for(let i=0;i<72;i++){const d=document.createElement('i');d.className='t';d.style.animationDelay=`${(i%12)*70}ms`;d.style.opacity=.2+(i%7)/10;m.append(d)}for(let i=0;i<6;i++){const n=document.createElement('b');n.className='node';n.style.left=`${i*18}%`;n.animate([{transform:'scale(.6)',opacity:.4},{transform:'scale(1.8)',opacity:1},{transform:'scale(.6)',opacity:.4}],{duration:1800+i*120,iterations:Infinity});trace.append(n)}</script></body></html>
